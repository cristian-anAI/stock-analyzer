version: '3.8'

services:
  postgres_prod:
    image: postgres:15-alpine
    container_name: stock_analyzer_postgres_prod
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_analyzer_prod}
      POSTGRES_USER: ${POSTGRES_USER:-stock_analyzer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # MUST be set in .env.prod
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # Different port to avoid conflicts with local

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/backups:/backups  # For database backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_analyzer_user} -d ${POSTGRES_DB:-stock_analyzer_prod}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    networks:
      - stock_analyzer_prod_network

    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Production backup service (runs daily)
  postgres_backup:
    image: postgres:15-alpine
    container_name: stock_analyzer_backup_prod
    restart: "no"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_analyzer_prod}
      POSTGRES_USER: ${POSTGRES_USER:-stock_analyzer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}

    volumes:
      - ./database/backups:/backups
      - ./database/backup_script.sh:/backup.sh:ro

    entrypoint: /bin/sh
    command: -c "/backup.sh"

    networks:
      - stock_analyzer_prod_network

    depends_on:
      - postgres_prod

    # Run backup via cron or external scheduler
    # This container is meant to be triggered manually or via cron

volumes:
  postgres_prod_data:
    driver: local

networks:
  stock_analyzer_prod_network:
    driver: bridge
